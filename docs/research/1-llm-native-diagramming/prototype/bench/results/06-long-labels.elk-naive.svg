" fill="#556070" text-anchor="middle">subscription changes [Kafka]</text></g><g class="edge-label" data-for="invoicing&gt;warehouse"><rect x="1045.5" y="127" width="125" height="32" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="1108" y="139.9" font-size="11" font-weight="400" fill="#556070" text-anchor="middle">Exports nightly revenue</text><text x="1108" y="153.9" font-size="11" font-weight="400" fill="#556070" text-anchor="middle">snapshots [Batch ETL]</text></g><g class="edge-label" data-for="subs&gt;crm"><rect x="739.5" y="256.5" width="149" height="46" rx="3" fill="#FFFFFF" fill-opacity="0.94"/><text x="814" y="269.4" font-size="11" font-weight="400" fill="#556070" text-anchor="middle">Synchronises account status</text><text x="814" y="283.4" font-size="11" font-weight="400" fill="#556070" text-anchor="middle">and plan for sales follow-up</text><text x="814" y="297.4" font-size="11" font-weight="400" fill="#556070" text-anchor="middle">[REST, OAuth 2.0]</text></g></svg>