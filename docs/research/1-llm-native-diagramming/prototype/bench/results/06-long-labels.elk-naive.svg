venue</text><text x="968" y="130.4" font-size="14" font-weight="600" fill="#14202E" text-anchor="middle">Recognition Service</text><text x="968" y="148.2" font-size="10.5" font-weight="400" fill="#4A5667" text-anchor="middle">[Service: Kotlin]</text><text x="968" y="169" font-size="11.5" font-weight="400" fill="#4A5667" text-anchor="middle">Generates invoices and recognises</text><text x="968" y="184" font-size="11.5" font-weight="400" fill="#4A5667" text-anchor="middle">revenue according to IFRS 15</text></g><g data-id="warehouse" class="node db"><title>Analytical Data Warehouse — [Database: Snowflake] — Historical subscription and revenue facts for reporting</title><path d="M1144,96 A106,7 0 0 1 1356,96 V190 A106,7 0 0 1 1144,190 Z" fill="#E6F4EF" stroke="#1C7A5F" stroke-width="1.5"/><path d="M1144,96 A106,7 0 0 0 1356,96" fill="none" stroke="#1C7A5F" stroke-width="1.5"/><text x="1250" y="126.4" font-size="14" font-weight="600" fill="#13241E" text-anchor="middle">Analytical Data Warehouse</text><text x="1250" y="144.2" font-size="10.5" font-weight="400" fill="#45584F" text-anchor="middle">[Database: Snowflake]</text><text x="1250" y="165" font-size="11.5" font-weight="400" fill="#45584F" text-anchor="middle">Historical subscription and revenue</text><text x="1250" y="180" font-size="11.5" font-weight="400" fill="#45584F" text-anchor="middle">facts for reporting</text></g><g data-id="crm" class="node external"><title>Third-Party Customer Relationship Management Platform — [External System] — Salesforce Sales Cloud</title><rect x="864" y="243" width="200" height="114" rx="8" fill="#F3F4F6" stroke="#6B7584" stroke-width="1.5" stroke-dasharray="5 3"/><text x="964" y="267.9" font-size="14" font-weight="600" fill="#1F2630" text-anchor="middle">Third-Party Customer</text><text x="964" y="285.9" font-size="14" font-weight="600" fill="#1F2630" text-anchor="middle">Relationship Management</text><text x="964" y="303.9" font-size="14" font-weight="600" fill="#1F2630" text-anc